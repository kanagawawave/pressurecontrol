substitutions:
  #dont forget to wire cs display pin to ground
  doutput_pin: "GPIO14" #blk display
  dclk_pin: "GPIO12" #scl display
  dmosi_pin: "GPIO11" #sda display
  ddc_pin: "GPIO10" #dc display
  dreset_pin: "GPIO13" #rst display
  rencpin_a: "GPIO4"
  rencpin_b: "GPIO5"
  rencbutton_pin: "GPIO6"
  dbtn_pin: "GPIO7"
  idletime: "180" #seconds to disable lvgl
  label_title: "Menu (v0.1)"
  label_flowsw: "Mnt. Fluxostato"
  label_temp: "Mnt. Temperatura"
  label_start_press: "Pressão Acio."
  label_stop_press: "Pressão Para."
  label_max_temp: "Temperatura Máx."
  label_max_pump_time: "Tempo Máx. Bomba"
  label_flowsw_time: "Tempo Lim. Flux"
  label_calx1: "Cal X1"
  label_caly1: "Cal Y1"
  label_calx2: "Cal X2"
  label_caly2: "Cal Y2"
  label_relay_test: "Teste Relay"
  label_wifi: "WIFI"
  label_oprmode: "Modo Opr."
  label_brightness: "Brilho do Display"
  label_qrcode: "Manual"
  qrlink: "https://github.com/kanagawawave/pressurecontrol/blob/main/INST.md"
  label_restart: "Reiniciar"
  label_factory: "Resetaurar Cfg"
 
globals:
  - id: selected_control_index
    type: int
    restore_value: no
    initial_value: "1"
 
  - id: control_menu_active
    type: bool
    restore_value: no
    initial_value: "false"
 
  - id: control_menu_cursor
    type: int
    restore_value: no
    initial_value: "1"
 
  - id: control_menu_turn_halfstep
    type: bool
    restore_value: no
    initial_value: "false"
 
  - id: mainscreen_halfstep
    type: bool
    restore_value: no
    initial_value: "true"
 
  - id: popup_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ota_err
    type: bool
    restore_value: no
    initial_value: "false"
 
sensor:
  - platform: rotary_encoder
    id: renc
    name: "REnc"
    restore_mode: ALWAYS_ZERO
    internal: true
    pin_a:
      number: ${rencpin_a}
      mode:
        input: true
        pullup: true
    pin_b:
      number: ${rencpin_b}
      mode:
        input: true
        pullup: true
    resolution: 2
    on_clockwise:
      - script.execute: rotary_cw
    on_anticlockwise:
      - script.execute: rotary_ccw
    web_server:
      sorting_group_id: lowlevel
      sorting_weight: 5
 
font:
  - file: "fonts/Nunito-SemiBold.ttf"
    id: nunito15
    size: 15
    glyphsets:
      - GF_Latin_Core
  
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: mdi_20
    size: 20
    bpp: 4
    glyphs: [
      "\U000F0504", # celsius icon
      "\U000F0026", # warning icon
      "\U000F0928", # wifi signal from 100%
      ]
 
binary_sensor:
  - platform: gpio
    id: rencbtn
    name: "REnc Button"
    internal: true
    pin:
      number: ${rencbutton_pin}
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_multi_click:
      # short press: select a menu item, or toggle the popup open/closed
      - timing:
          - ON for at most 300ms
          - OFF for at least 50ms
        then:
          - lambda: |-
              lv_display_trigger_activity(NULL);
          - if:
              condition:
                lvgl.is_paused
              then:
                - light.turn_on: display_backlight
              else:
                - if:
                    condition:
                      - lambda: 'return id(ota_err);'
                    then:
                      - lambda: |-
                          id(ota_err) = false;
                          lv_obj_add_flag(id(ota_widget), LV_OBJ_FLAG_HIDDEN);
                    else:
                      - lambda: |-
                          if (id(control_menu_active)) {
                            id(select_control_menu_item).execute();
                          } else if (id(popup_active) && (id(selected_control_index) >= 3 && id(selected_control_index) <= 11)) {
                            auto s = id(popup_spinbox_idle);
                            if (lv_spinbox_get_step(s) > 1)
                              lv_spinbox_step_next(s);
                            else
                              lv_spinbox_set_cursor_pos(s, lv_spinbox_get_digit_count(s) - 1);
                          } else if (id(popup_active) && (id(selected_control_index) == 17 || id(selected_control_index) == 18)) {
                            if (lv_obj_has_state(id(confirm_label_box), LV_STATE_FOCUSED)) {
                              lv_obj_send_event(id(confirm_label_box), LV_EVENT_CLICKED, NULL);
                            } else {
                              lv_obj_send_event(id(cancel_label_box), LV_EVENT_CLICKED, NULL);
                            }
                          } else if (id(popup_active)) {
                            id(hide_popup).execute();
                          }
      
      # long press: open the menu, or close it / close the popup if already open
      - timing:
          - ON for at least 700ms
        then:
          - lambda: |-
              lv_display_trigger_activity(NULL);
          - if:
              condition:
                lvgl.is_paused
              then:
                - light.turn_on: display_backlight
              else:
                - if:
                    condition:
                      - lambda: 'return id(ota_err);'
                    then:
                      - lambda: |-
                          id(ota_err) = false;
                          lv_obj_add_flag(id(ota_widget), LV_OBJ_FLAG_HIDDEN);
                    else:
                      - if:
                          condition:
                            lvgl.page.is_showing: main_page
                          then:
                            - lambda: |-
                                if (id(popup_active)) {
                                  id(hide_popup).execute();
                                } else if (id(control_menu_active)) {
                                  id(hide_control_menu).execute();
                                } else {
                                  id(show_control_menu).execute();
                                }
    web_server:
      sorting_group_id: lowlevel
      sorting_weight: 7
  
  - platform: gpio
    id: dbtn
    name: "KEY 0"
    internal: true
    pin:
      number: ${dbtn_pin}
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      - lambda: |-
          lv_display_trigger_activity(NULL);
      - if:
          condition:
            lvgl.is_paused
          then:
            - light.turn_on: display_backlight
          else:
            - if:
                condition:
                  - lambda: 'return id(ota_err);'
                then:
                  - lambda: |-
                      id(ota_err) = false;
                      lv_obj_add_flag(id(ota_widget), LV_OBJ_FLAG_HIDDEN);
                else:
                  - button.press: restartop
    web_server:
      sorting_group_id: lowlevel
      sorting_weight: 6

script:
  - id: rotary_cw
    mode: restart
    then:
      - script.execute:
          id: handle_rotary_turn
          direction: 1
 
  - id: rotary_ccw
    mode: restart
    then:
      - script.execute:
          id: handle_rotary_turn
          direction: -1
 
  - id: handle_rotary_turn
    mode: restart
    parameters:
      direction: int
    then:
      - lambda: |-
          lv_display_trigger_activity(NULL);
      - if:
          condition:
            lvgl.is_paused
          then:
            - light.turn_on: display_backlight
          else:
            - if:
                condition:
                  - lambda: 'return id(ota_err);'
                then:
                  - lambda: |-
                      id(ota_err) = false;
                      lv_obj_add_flag(id(ota_widget), LV_OBJ_FLAG_HIDDEN);
                else:
                  - if:
                      condition:
                        and:
                          - lvgl.page.is_showing: main_page
                          - lambda: 'return !id(control_menu_active) && !id(popup_active);'
                      then:
                        - lambda: |-
                            if (id(mainscreen_halfstep)) {
                              int32_t scroll_y = lv_obj_get_scroll_y(id(info_widget));
                              int32_t scroll_bottom = lv_obj_get_scroll_bottom(id(info_widget));
                              if (direction > 0 && scroll_bottom <= 0) {
                                lv_obj_scroll_to_y(id(info_widget), 0, LV_ANIM_OFF);
                              } else if (direction < 0 && scroll_y <= 0) {
                                lv_obj_scroll_to_y(id(info_widget), scroll_y + scroll_bottom, LV_ANIM_OFF);
                              } else {
                                lv_obj_scroll_by(id(info_widget), 0, direction * -15, LV_ANIM_ON);
                              }
                            }
                            id(mainscreen_halfstep) = !id(mainscreen_halfstep);
                      else:
                        - if:
                            condition:
                              lambda: 'return id(control_menu_active);'
                            then:
                              - lambda: |-
                                  if (id(control_menu_turn_halfstep)) {
                                    id(control_menu_cursor) += direction;
                                    if (id(control_menu_cursor) > 18) id(control_menu_cursor) = 1;
                                    if (id(control_menu_cursor) < 1) id(control_menu_cursor) = 18;
                                  }
                                  if (id(control_menu_cursor) == 1 && id(opr_mode).state) {
                                    id(control_menu_cursor) += direction;
                                    if (id(control_menu_cursor) > 18) id(control_menu_cursor) = 1;
                                    if (id(control_menu_cursor) < 1) id(control_menu_cursor) = 18;
                                  }
                                  id(control_menu_turn_halfstep) = !id(control_menu_turn_halfstep);
                              - script.execute: render_control_menu
                            else:
                              - if:
                                  condition:
                                    lambda: 'return id(popup_active);'
                                  then:
                                    - script.execute:
                                        id: adjust_popup_value
                                        direction: direction
 
  - id: adjust_popup_value
    mode: restart
    parameters:
      direction: int
    then:
      - lambda: |-
          if (id(control_menu_turn_halfstep)) {
            switch (id(selected_control_index)) {
              case 1:
                id(flxmnt).toggle();
                break;
              case 2:
                id(tmpmnt).toggle();
                break;
              case 3:
                if (direction > 0) {
                  lv_spinbox_increment(id(popup_spinbox_idle));
                } else {
                  lv_spinbox_decrement(id(popup_spinbox_idle));
                }
                {
                  float v = lv_spinbox_get_value(id(popup_spinbox_idle)) / 10.0f;
                  id(lowpressure).make_call().set_value(v).perform();
                }
                break;
              case 4:
                if (direction > 0) {
                  lv_spinbox_increment(id(popup_spinbox_idle));
                } else {
                  lv_spinbox_decrement(id(popup_spinbox_idle));
                }
                {
                  float v = lv_spinbox_get_value(id(popup_spinbox_idle)) / 10.0f;
                  id(highpressure).make_call().set_value(v).perform();
                }
                break;
              case 5:
                if (direction > 0) {
                  lv_spinbox_increment(id(popup_spinbox_idle));
                } else {
                  lv_spinbox_decrement(id(popup_spinbox_idle));
                }
                {
                  float v = lv_spinbox_get_value(id(popup_spinbox_idle));
                  id(pump_maxtmp).make_call().set_value(v).perform();
                }
                break;
              case 6:
                if (direction > 0) {
                  lv_spinbox_increment(id(popup_spinbox_idle));
                } else {
                  lv_spinbox_decrement(id(popup_spinbox_idle));
                }
                {
                  float v = lv_spinbox_get_value(id(popup_spinbox_idle));
                  id(pump_time).make_call().set_value(v).perform();
                }
                break;
              case 7:
                if (direction > 0) {
                  lv_spinbox_increment(id(popup_spinbox_idle));
                } else {
                  lv_spinbox_decrement(id(popup_spinbox_idle));
                }
                {
                  float v = lv_spinbox_get_value(id(popup_spinbox_idle));
                  id(flowswtime).make_call().set_value(v).perform();
                }
                break;
              case 8:
                if (direction > 0) {
                  lv_spinbox_increment(id(popup_spinbox_idle));
                } else {
                  lv_spinbox_decrement(id(popup_spinbox_idle));
                }
                {
                  float v = lv_spinbox_get_value(id(popup_spinbox_idle)) / 100.0f;
                  id(cal_x1).make_call().set_value(v).perform();
                }
                break;
              case 9:
                if (direction > 0) {
                  lv_spinbox_increment(id(popup_spinbox_idle));
                } else {
                  lv_spinbox_decrement(id(popup_spinbox_idle));
                }
                {
                  float v = lv_spinbox_get_value(id(popup_spinbox_idle)) / 100.0f;
                  id(cal_y1).make_call().set_value(v).perform();
                }
                break;
              case 10:
                if (direction > 0) {
                  lv_spinbox_increment(id(popup_spinbox_idle));
                } else {
                  lv_spinbox_decrement(id(popup_spinbox_idle));
                }
                {
                  float v = lv_spinbox_get_value(id(popup_spinbox_idle)) / 100.0f;
                  id(cal_x2).make_call().set_value(v).perform();
                }
                break;
              case 11:
                if (direction > 0) {
                  lv_spinbox_increment(id(popup_spinbox_idle));
                } else {
                  lv_spinbox_decrement(id(popup_spinbox_idle));
                }
                {
                  float v = lv_spinbox_get_value(id(popup_spinbox_idle)) / 100.0f;
                  id(cal_y2).make_call().set_value(v).perform();
                }
                break;
              case 12:
                id(test_relay).execute();
                break;
              case 13:
                id(wifisw).toggle();
                break;
              case 14:
                id(opr_mode).toggle();
                break;
              case 15:
                if (direction > 0) {
                  lv_slider_set_value(id(popup_slider_idle), lv_slider_get_value(id(popup_slider_idle)) + 10, LV_ANIM_OFF);
                } else {
                  lv_slider_set_value(id(popup_slider_idle), lv_slider_get_value(id(popup_slider_idle)) - 10, LV_ANIM_OFF);
                }
                {
                  float v = lv_slider_get_value(id(popup_slider_idle)) / 100.0f;
                  id(display_backlight).turn_on().set_brightness(v).perform();
                }
                break;
              case 16:
                id(hide_popup).execute();
                break;
              case 17:
              case 18:
                if (lv_obj_has_state(id(cancel_label_box), LV_STATE_FOCUSED)) {
                  lv_obj_clear_state(id(cancel_label_box), LV_STATE_FOCUSED);
                  lv_obj_add_state(id(confirm_label_box), LV_STATE_FOCUSED);
                } else {
                  lv_obj_clear_state(id(confirm_label_box), LV_STATE_FOCUSED);
                  lv_obj_add_state(id(cancel_label_box), LV_STATE_FOCUSED);
                }
                break;
            }
          }
          id(control_menu_turn_halfstep) = !id(control_menu_turn_halfstep);
 
  - id: show_control_menu
    mode: restart
    then:
      - lambda: |-
          id(control_menu_active) = true;
          if (id(selected_control_index) < 1 || id(selected_control_index) > 18) {
            id(selected_control_index) = 1;
          }
          if (id(selected_control_index) == 1 && id(opr_mode).state) {
            id(selected_control_index) = 2;
          }
          id(control_menu_cursor) = id(selected_control_index);
          id(control_menu_turn_halfstep) = true;

      - script.execute: render_control_menu
 
  - id: render_control_menu
    mode: restart
    then:
      - lambda: |-
          const char *labels[18] = {
            "${label_flowsw}",
            "${label_temp}",
            "${label_start_press}",
            "${label_stop_press}",
            "${label_max_temp}",
            "${label_max_pump_time}",
            "${label_flowsw_time}",
            "${label_calx1}",
            "${label_caly1}",
            "${label_calx2}",
            "${label_caly2}",
            "${label_relay_test}",
            "${label_wifi}",
            "${label_oprmode}",
            "${label_brightness}",
            "${label_qrcode}",
            "${label_restart}",
            "${label_factory}",
          };
          lv_obj_t *idle_items[18] = {
            id(control_menu_idle_item_1),
            id(control_menu_idle_item_2),
            id(control_menu_idle_item_3),
            id(control_menu_idle_item_4),
            id(control_menu_idle_item_5),
            id(control_menu_idle_item_6),
            id(control_menu_idle_item_7),
            id(control_menu_idle_item_8),
            id(control_menu_idle_item_9),
            id(control_menu_idle_item_10),
            id(control_menu_idle_item_11),
            id(control_menu_idle_item_12),
            id(control_menu_idle_item_13),
            id(control_menu_idle_item_14),
            id(control_menu_idle_item_15),
            id(control_menu_idle_item_16),
            id(control_menu_idle_item_17),
            id(control_menu_idle_item_18),
          };
 
          int visible_row = 0;
          for (int i = 0; i < 18; i++) {
            const bool selected = ((i + 1) == id(control_menu_cursor));
            char item_text[64];
            
            if (i == 0 && id(opr_mode).state) {
              // case 1: hide entirely when opr_mode is ON
              lv_obj_add_flag(idle_items[i], LV_OBJ_FLAG_HIDDEN);
              continue;
            } else {
              lv_obj_clear_flag(idle_items[i], LV_OBJ_FLAG_HIDDEN);
            }

            lv_obj_set_y(idle_items[i], visible_row * 28);

            visible_row++;

            if (i == 5 && id(opr_mode).state) {
              // case 6: renamed label when opr_mode is ON
              snprintf(item_text, sizeof(item_text), "  Tempo Máx Motor");
            } else {
              snprintf(item_text, sizeof(item_text), "  %s", labels[i]);
            }

            lv_label_set_text(idle_items[i], item_text);
 
            if (selected) {
              lv_obj_set_style_bg_color(idle_items[i], lv_color_hex(0x66CCFF), LV_PART_MAIN);
              lv_obj_set_style_bg_opa(idle_items[i], LV_OPA_COVER, LV_PART_MAIN);
              lv_obj_set_style_text_color(idle_items[i], lv_color_hex(0x000000), LV_PART_MAIN);
              lv_obj_set_style_radius(idle_items[i], 6, LV_PART_MAIN);
            } else {
              lv_obj_set_style_bg_opa(idle_items[i], LV_OPA_TRANSP, LV_PART_MAIN);
              lv_obj_set_style_text_color(idle_items[i], lv_color_hex(0x9BA2BC), LV_PART_MAIN);
            }
          }
          lv_obj_scroll_to_view(idle_items[id(control_menu_cursor) - 1], LV_ANIM_OFF);
      - lvgl.widget.show: control_menu_idle
 
  - id: hide_control_menu
    mode: restart
    then:
      - lambda: |-
          id(control_menu_active) = false;
          id(selected_control_index) = 1;
      - lvgl.widget.hide: control_menu_idle
 
  - id: select_control_menu_item
    mode: restart
    then:
      - lvgl.widget.disable: control_menu_idle
      - lambda: |-
          if (id(control_menu_cursor) == 1 && id(opr_mode).state) return;
          id(selected_control_index) = id(control_menu_cursor);
      - script.execute: show_selected_control_popup
      - lambda: |-
          id(control_menu_active) = false;
 
  - id: show_selected_control_popup
    mode: restart
    then:
      - lambda: |-
          id(popup_active) = true;
          if (id(selected_control_index) < 1 || id(selected_control_index) > 18) {
            id(selected_control_index) = 1;
          }
      - script.execute: render_popup
      #- script.execute: popup_autoclose
 
  - id: render_popup
    mode: restart
    then:
      - lambda: |-
          lv_obj_clear_flag(id(popup_idle), LV_OBJ_FLAG_HIDDEN);

          if (id(selected_control_index) == 1) {
            lv_obj_set_size(id(popup_idle), 160, 150);
            lv_obj_clear_flag(id(popup_left_msg), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(popup_right_msg), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(popup_left_msg), "OFF");
            lv_label_set_text(id(popup_right_msg), "ON");
            lv_obj_clear_flag(id(toggle_switch_1), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(popup_title_idle), "${label_flowsw}");
 
          } else if (id(selected_control_index) == 2) {
            lv_obj_set_size(id(popup_idle), 160, 150);
            lv_obj_clear_flag(id(popup_left_msg), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(popup_right_msg), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(popup_left_msg), "OFF");
            lv_label_set_text(id(popup_right_msg), "ON");
            lv_obj_clear_flag(id(toggle_switch_2), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(popup_title_idle), "${label_temp}");
 
          } else if (id(selected_control_index) == 3) {
            lv_obj_set_size(id(popup_idle), 230, 150);
            lv_obj_clear_flag(id(popup_left_msg), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(popup_right_msg), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text_fmt(id(popup_left_msg), "Min \n%.2f Bar", id(lowpressure).traits.get_min_value());
            lv_label_set_text_fmt(id(popup_right_msg), "Max \n%.2f Bar", id(lowpressure).traits.get_max_value());
            lv_obj_clear_flag(id(popup_spinbox_idle), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(popup_title_idle), "${label_start_press}");
            lv_spinbox_set_range(id(popup_spinbox_idle), (int)round(id(lowpressure).traits.get_min_value() * 10), (int)round(id(lowpressure).traits.get_max_value() * 10));
            lv_spinbox_set_digit_format(id(popup_spinbox_idle), 2, 1);
            lv_spinbox_set_cursor_pos(id(popup_spinbox_idle), 1);
            lv_spinbox_set_value(id(popup_spinbox_idle), (int)round(id(lowpressure).state * 10));
          
          } else if (id(selected_control_index) == 4) {
            lv_obj_set_size(id(popup_idle), 230, 150);
            lv_obj_clear_flag(id(popup_left_msg), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(popup_right_msg), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text_fmt(id(popup_left_msg), "Min \n%.2f Bar", id(highpressure).traits.get_min_value());
            lv_label_set_text_fmt(id(popup_right_msg), "Max \n%.2f Bar", id(highpressure).traits.get_max_value());
            lv_obj_clear_flag(id(popup_spinbox_idle), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(popup_title_idle), "${label_stop_press}");
            lv_spinbox_set_range(id(popup_spinbox_idle), (int)round(id(highpressure).traits.get_min_value() * 10), (int)round(id(highpressure).traits.get_max_value() * 10));
            lv_spinbox_set_digit_format(id(popup_spinbox_idle), 2, 1);
            lv_spinbox_set_cursor_pos(id(popup_spinbox_idle), 1);
            lv_spinbox_set_value(id(popup_spinbox_idle), (int)round(id(highpressure).state * 10));
          
          } else if (id(selected_control_index) == 5) {
            lv_obj_set_size(id(popup_idle), 230, 150);
            lv_obj_clear_flag(id(popup_left_msg), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(popup_right_msg), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text_fmt(id(popup_left_msg), "Min \n%.0f°C", id(pump_maxtmp).traits.get_min_value());
