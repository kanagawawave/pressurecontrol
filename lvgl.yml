  - id: hide_popup
    mode: restart
    then:
      #- script.stop: popup_autoclose
      - lambda: |-
          id(popup_active) = false;
      - lambda: |-
          lv_obj_add_flag(id(popup_idle), LV_OBJ_FLAG_HIDDEN);

          if (id(selected_control_index) >= 1 && id(selected_control_index) <= 14) {
            lv_obj_add_flag(id(popup_left_msg), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(popup_right_msg), LV_OBJ_FLAG_HIDDEN);
          }

          switch (id(selected_control_index)) {
            case 1: lv_obj_add_flag(id(toggle_switch_1), LV_OBJ_FLAG_HIDDEN); break;
            case 2: lv_obj_add_flag(id(toggle_switch_2), LV_OBJ_FLAG_HIDDEN); break;
            case 3:
            case 4:
            case 5:
            case 6:
            case 7: lv_obj_add_flag(id(popup_spinbox_idle), LV_OBJ_FLAG_HIDDEN); break;
            case 8:
            case 9:
            case 10:
            case 11: lv_obj_add_flag(id(popup_spinbox_idle), LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(id(popup_ads_label_idle), LV_OBJ_FLAG_HIDDEN); break;
            case 12: lv_obj_add_flag(id(toggle_switch_3), LV_OBJ_FLAG_HIDDEN); break;
            case 13: lv_obj_add_flag(id(toggle_switch_4), LV_OBJ_FLAG_HIDDEN); break;
            case 14: lv_obj_add_flag(id(toggle_switch_5), LV_OBJ_FLAG_HIDDEN); break;
            case 15: lv_obj_add_flag(id(popup_slider_idle), LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(id(current_bright), LV_OBJ_FLAG_HIDDEN); break;
            case 16: lv_obj_add_flag(id(popup_qrcode_idle), LV_OBJ_FLAG_HIDDEN); break;
            case 17:
            case 18: lv_obj_add_flag(id(confirm_label_box), LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(id(cancel_label_box), LV_OBJ_FLAG_HIDDEN); break;
          }
      - lambda: |-
          id(control_menu_active) = true;
      - lvgl.widget.enable: control_menu_idle
 
  - id: test_relay
    mode: restart
    then:
      - switch.turn_on: pumprelay
      - delay: 5s
      - switch.turn_off: pumprelay

spi:
  - id: bus_tft
    clk_pin: ${dclk_pin}
    mosi_pin: ${dmosi_pin}

output:
  - platform: ledc
    pin: ${doutput_pin}
    id: backlight_output
    inverted: false

light:
  - platform: monochromatic
    id: "display_backlight"
    name: Display Backlight
    output: backlight_output
    restore_mode: RESTORE_AND_ON
    internal: true
    initial_state:
      brightness: 60%
    default_transition_length: 150ms
    on_state:
      then:
        - lambda: |-
            lv_label_set_text_fmt(id(current_bright), "%d%%", (int)round(id(display_backlight).remote_values.get_brightness() * 100));
            if (id(selected_control_index) == 15 && id(popup_active)) {
              lv_slider_set_value(id(popup_slider_idle), (int)round(id(display_backlight).remote_values.get_brightness() * 100), LV_ANIM_ON);
            }
    on_turn_on:
      then:
        - lvgl.resume:
        - lvgl.widget.redraw:
    on_turn_off:
      then:
        - if:
            condition:
              lambda: 'return id(popup_active);'
            then:
              - script.execute: hide_popup
        - if:
            condition:
              lambda: 'return id(control_menu_active);'
            then:
              - script.execute: hide_control_menu
    web_server:
      sorting_group_id: lowlevel
      sorting_weight: 8

display:
  - platform: mipi_spi
    spi_id: bus_tft
    id: dsp0
    model: ST7789V
    data_rate: 40MHz
    spi_mode: MODE3
    dc_pin: ${ddc_pin}
    reset_pin: ${dreset_pin}
    show_test_card: false
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
    dimensions: 
      width: 240
      height: 320

lvgl:
  id: lvgl_id
  displays:
    - dsp0
  rotation: 270
  buffer_size: 12%
  color_depth: 16
  default_font: nunito15
  on_idle:
    timeout: !lambda "return (${idletime} * 1000);"
    then:
      - light.turn_off: display_backlight
      - lvgl.pause:
          show_snow: true

  theme:
    label:
      text_color: 0x9BA2BC

  top_layer:
